name: Tárgyikonok letöltése

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  letoltes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Képek letöltése
        run: |
          mkdir -p kepek
          uj=0
          while read -r f; do
            [ -z "$f" ] && continue
            if [ -f "kepek/$f" ]; then continue; fi
            if curl -sfL "https://westzz.innogamescdn.com/images/items/yield/$f" -o "kepek/$f"; then
              uj=$((uj+1))
            else
              echo "nem sikerült: $f"
            fi
          done < kepek-lista.txt
          echo "letöltve: $uj új kép"
          ls kepek | wc -l

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add kepek
          git diff --staged --quiet || git commit -m "Tárgyikonok letöltése"
          git push
